---
name: pre-commit
on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      RAW_LOG: pre-commit.log
      CS_XML: pre-commit.xml
      SKIP: no-commit-to-branch
      # Tell pre-commit-uv to use uv for creating environments
      PRE_COMMIT_USE_UV: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements_dev.txt
            pyproject.toml
            .pre-commit-config.yaml

      - name: Create virtual environment
        run: uv venv .venv

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-4|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          source .venv/bin/activate
          uv pip install pre-commit pre-commit-uv

      - name: Run pre-commit hooks
        run: |
          set -o pipefail
          source .venv/bin/activate
          pre-commit gc
          pre-commit run --show-diff-on-failure --color=always --all-files | tee ${RAW_LOG}

      - name: Convert Raw Log to Checkstyle format (launch action)
        uses: mdeweerd/logToCheckStyle@3e43ea94715edbf412c1f51c39c6c0fce55bbec0  # v2026.8.2
        if: ${{ failure() }}
        with:
          in: ${{ env.RAW_LOG }}
          out: ${{ env.CS_XML }}

      - name: Provide log as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: precommit-logs
          path: |
            ${{ env.RAW_LOG }}
            ${{ env.CS_XML }}
          retention-days: 2
