---
name: pre-commit
on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      RAW_LOG: pre-commit.log
      CS_XML: pre-commit.xml
      SKIP: no-commit-to-branch
      # Tell pre-commit-uv to use uv for creating environments
      PRE_COMMIT_USE_UV: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements_dev.txt
            pyproject.toml
            .pre-commit-config.yaml

      - name: Create virtual environment
        run: uv venv .venv

      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-4|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          source .venv/bin/activate
          uv pip install pre-commit pre-commit-uv

      - name: Run pre-commit hooks
        run: |
          set -o pipefail
          source .venv/bin/activate
          pre-commit gc
          pre-commit run --show-diff-on-failure --color=always --all-files | tee ${RAW_LOG}

      - name: Convert Raw Log to Checkstyle format (launch action)
        uses: mdeweerd/logToCheckStyle@f9e1fc62b95521904a70dd4f667fcdb20b012ca9 # v2025.11.2
        if: ${{ failure() }}
        with:
          in: ${{ env.RAW_LOG }}
          out: ${{ env.CS_XML }}

      - name: Provide log as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: precommit-logs
          path: |
            ${{ env.RAW_LOG }}
            ${{ env.CS_XML }}
          retention-days: 2
