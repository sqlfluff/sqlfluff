name: Publish SQLFluff-rs PyPI Version

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-rust-dialects:
    name: Generate Rust dialects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Generate Rust dialects
        run: |
          python -m pip install -e .
          python utils/rustify.py build

      - name: Upload generated Rust dialects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-rust-dialects
          path: sqlfluffrs/sqlfluffrs_dialects/src/
          retention-days: 1

  build-wheels:
    needs: [generate-rust-dialects]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux (manylinux)
          - {runner: ubuntu-22.04, target: x86_64, manylinux: auto, artifact: linux-x86_64}
          - {runner: ubuntu-22.04, target: x86, manylinux: auto, artifact: linux-x86}
          - {runner: ubuntu-22.04, target: aarch64, manylinux: auto, artifact: linux-aarch64}
          - {runner: ubuntu-22.04, target: armv7, manylinux: auto, artifact: linux-armv7}
          # Linux (musllinux)
          - {runner: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2, artifact: musllinux-x86_64}
          - {runner: ubuntu-22.04, target: x86, manylinux: musllinux_1_2, artifact: musllinux-x86}
          - {runner: ubuntu-22.04, target: aarch64, manylinux: musllinux_1_2, artifact: musllinux-aarch64}
          - {runner: ubuntu-22.04, target: armv7, manylinux: musllinux_1_2, artifact: musllinux-armv7}
          # Windows
          - {runner: windows-latest, target: x64, manylinux: "", artifact: windows-x64, arch: x64}
          # macOS
          - {runner: macos-15-intel, target: x86_64, manylinux: "", artifact: macos-x86_64}
          - {runner: macos-15, target: aarch64, manylinux: "", artifact: macos-aarch64}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Download generated Rust dialects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-rust-dialects
          path: sqlfluffrs/sqlfluffrs_dialects/src/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.arch || null }}

      - name: Build wheels
        if: matrix.platform.runner == 'ubuntu-22.04'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release -i python3.10 --out dist --manifest-path sqlfluffrs/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux || '' }}

      - name: Build wheels
        if: matrix.platform.runner != 'ubuntu-22.04'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path sqlfluffrs/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux || '' }}

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist

  sdist:
    needs: [generate-rust-dialects]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Download generated Rust dialects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-rust-dialects
          path: sqlfluffrs/sqlfluffrs_dialects/src/

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path sqlfluffrs/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-wheels, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'wheels-*/*'

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_SQLFLUFFRS_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
