name: Publish SQLMesh templater PyPI Version

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build distribution
        run: python -m build --sdist --wheel plugins/sqlfluff-templater-sqlmesh

      - name: Check distribution
        run: python -m twine check plugins/sqlfluff-templater-sqlmesh/dist/*

      - name: Publish Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: plugins/sqlfluff-templater-sqlmesh/dist/
          skip-existing: true
