#
# This updates the current draft release notes when a PR is merged
#
name: Add to Release Notes
on:
  push:
    branches:
      - main
jobs:
  draft-release:
    runs-on: ubuntu-slim
    if: github.repository == 'sqlfluff/sqlfluff'
    steps:
    - name: Update release notes
      uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
