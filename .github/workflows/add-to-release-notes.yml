#
# This updates the current draft release notes when a PR is merged
#
name: Add to Release Notes
on:
  push:
    branches:
      - main
jobs:
  draft-release:
    runs-on: ubuntu-slim
    if: github.repository == 'sqlfluff/sqlfluff'
    steps:
    - name: Update release notes
      uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0  # v7.10.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
