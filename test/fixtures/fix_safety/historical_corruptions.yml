# Fixes reported in closed `fix corrupts sql` issues, with the input and the
# corrupted output from each issue (some shortened to the part the fix broke).
# `postgres` and `duckdb` are what each oracle of `utils/fix_safety.py` makes of
# the pair: `detected` (the trees differ, or the output doesn't parse), `missed`
# (the same tree) or `input_unparsable`. `rule` is the rule's current code,
# `unknown` where the issue doesn't say.
# Of the 66 issues, the rest use Jinja or dbt, are in SQL that neither database
# parses, or don't give the corrupted output.
- issue: 906
  dialect: ansi
  rule: LT12
  input: "select *\r\nfrom table"
  bad_output: |-
    select *
    from table
    e
  postgres: input_unparsable
  duckdb: input_unparsable
- issue: 1268
  dialect: ansi
  rule: ST06
  input: |-
    INSERT INTO s.t (id, example_column, rank_asc, rank_desc)
    SELECT id, CASE WHEN col_a IN ('a', 'b', 'c') THEN col_a END AS example_column, rank_asc, rank_desc
    FROM s2.t2
  bad_output: |-
    INSERT INTO s.t (id, example_column, rank_asc, rank_desc)
    SELECT id, rank_asc, rank_desc, CASE WHEN col_a IN ('a', 'b', 'c') THEN col_a END AS example_column
    FROM s2.t2
  postgres: detected
  duckdb: input_unparsable
- issue: 1374
  dialect: ansi
  rule: unknown
  input: SELECT project1.FOO(value) AS value
  bad_output: SELECT project1.PROJECT1.PROJECT1.PROJECT1.FOO(value) AS value
  postgres: detected
  duckdb: detected
- issue: 1394
  dialect: ansi
  rule: CP02
  input: |-
    insert into A1B2C3
    select A from B
  bad_output: |-
    insert into a1_b2_c3
    select a from b
  postgres: detected
  duckdb: input_unparsable
- issue: 1462
  dialect: exasol
  rule: AL05
  input: |-
    SELECT col1, (SELECT count(*) FROM base b WHERE a.col2 = b.col2) AS x_cnt,
    FROM without_dup a
  bad_output: |-
    SELECT col1, (SELECT count(*) FROM base b WHERE a.col2 = b.col2) AS x_cnt,
    FROM without_dup
  postgres: input_unparsable
  duckdb: detected
  note: input as reported has a trailing comma before FROM
- issue: 2014
  dialect: ansi
  rule: CV06
  input: |-
    SELECT a
    FROM b --comment
    ;
  bad_output: |-
    SELECT a
    FROM b --comment;
  postgres: missed
  duckdb: missed
  note: the semicolon moves into the comment
