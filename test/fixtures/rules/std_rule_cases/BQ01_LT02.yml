rule: BQ01,LT02
configs:
  core:
    dialect: bigquery

test_fail_multiple_chains_in_one_expression:
  fail_str: |
    SELECT
        (foo).LOWER() || (bar).TRIM() AS result
    FROM t;
  fix_str: |
    SELECT
        (foo)
            .LOWER() || (bar)
            .TRIM() AS result
    FROM t;
  configs:
    core:
      dialect: bigquery
    rules:
      bigquery.chained_functions:
        writing_style: indented
test_fail_inline_select_input:
  fail_str: |
    SELECT (foo).LOWER().TRIM() AS result FROM t;
  fix_str: |
    SELECT (foo)
        .LOWER()
        .TRIM() AS result FROM t;
  configs:
    core:
      dialect: bigquery
    rules:
      bigquery.chained_functions:
        writing_style: indented
test_fail_wrong_input_indentation:
  fail_str: |
    SELECT
      (foo).LOWER().TRIM() AS bar
    FROM t;
  fix_str: |
    SELECT
        (foo)
