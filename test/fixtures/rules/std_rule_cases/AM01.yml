rule: AM01

test_pass_only_group_by:
  # check if using select distinct and group by
  pass_str: select a from b group by a

test_fail_distinct_and_group_by:
  fail_str: select distinct a from b group by a

test_pass_distinct_on_and_group_by:
  # DISTINCT ON keeps one row per value of its expressions, which GROUP BY
  # doesn't do, so the two aren't redundant.
  pass_str: select distinct on (a) a, b from t group by a, b
  configs:
    core:
      dialect: postgres

test_pass_distinct_on_and_group_by_duckdb:
  pass_str: select distinct on (a) a, b from t group by a, b
  configs:
    core:
      dialect: duckdb

test_fail_distinct_and_group_by_postgres:
  # Plain DISTINCT is still flagged in dialects that support DISTINCT ON.
  fail_str: select distinct a from b group by a
  configs:
    core:
      dialect: postgres
