    core:
      dialect: bigquery
    rules:
      layout.chained_functions:
        writing_style: indented
test_pass_comments:
  pass_str: |
    SELECT
        (foo) -- input
            .LOWER()
            -- normalize the result
            .TRIM() AS bar
    FROM t;
  configs:
    core:
      dialect: bigquery
    rules:
      layout.chained_functions:
        writing_style: indented
test_fail_indent_after_comment:
