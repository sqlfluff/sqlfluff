test_fail_two_space_configuration:
  fail_str: |
    SELECT
      (foo).LOWER().TRIM() AS bar
    FROM t;
  fix_str: |
    SELECT
      (foo)
        .LOWER()
        .TRIM() AS bar
    FROM t;
  configs:
    core:
      dialect: bigquery
    rules:
      layout.chained_functions:
        writing_style: indented
    indentation:
      tab_space_size: 2
test_fail_tabs:
  fail_str: "SELECT\n\t(foo).LOWER().TRIM() AS bar\nFROM t;\n"
  fix_str: "SELECT\n\t(foo)\n\t\t.LOWER()\n\t\t.TRIM() AS bar\nFROM t;\n"
  configs:
    core:
      dialect: bigquery
    rules:
      layout.chained_functions:
        writing_style: indented
    indentation:
      indent_unit: tab
test_fail_consistent_keeps_first_indented_chain:
  fail_str: |
    SELECT
        (foo)
            .LOWER()
            .TRIM() AS first_value,
        (bar).LOWER().TRIM() AS second_value;
  fix_str: |
    SELECT
        (foo)
            .LOWER()
            .TRIM() AS first_value,
