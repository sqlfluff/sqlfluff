rule: ST01

no_redundant_else_null:
  pass_str: |
    select
        case
            when name = 'cat' then 'meow'
            when name = 'dog' then 'woof'
        end
    from x

redundant_else_null:
  fail_str: |
    select
        case
            when name = 'cat' then 'meow'
            when name = 'dog' then 'woof'
            else null
        end
    from x

  fix_str: |
    select
        case
            when name = 'cat' then 'meow'
            when name = 'dog' then 'woof'
        end
    from x

alternate_case_when_syntax:

  fail_str: |
    select
        case name
            when 'cat' then 'meow'
            when 'dog' then 'woof'
            else null
        end
    from x

  fix_str: |
    select
        case name
            when 'cat' then 'meow'
            when 'dog' then 'woof'
        end
    from x

alternate_case_when_syntax_boolean:
  pass_str: |
    select
        case name
            when 'cat' then true
            when 'dog' then true
            else name is null
        end
    from x

else_expression:
  pass_str: |
    select
        case name
            when 'cat' then 'meow'
            when 'dog' then 'woof'
            else iff(wing_type is not null, 'tweet', 'invalid')
        end
    from x

redundant_else_null_with_comment:
  # The comment lives *inside* the else clause, so it must survive the
  # clause being removed. https://github.com/sqlfluff/sqlfluff/issues/8562
  fail_str: |
    select
        case
            when name = 'cat' then 'meow'
            when name = 'dog' then 'woof'
            else /* keep default */ null
        end
    from x

  fix_str: |
    select
        case
            when name = 'cat' then 'meow'
            when name = 'dog' then 'woof'
            /* keep default */
        end
    from x

redundant_else_null_with_comment_on_own_line:
  fail_str: |
    select
        case
            when name = 'cat' then 'meow'
            else
                -- keep default
                null
        end
    from x

  fix_str: |
    select
        case
            when name = 'cat' then 'meow'
            -- keep default
        end
    from x

redundant_else_null_with_several_comments:
  fail_str: |
    select
        case
            when name = 'cat' then 'meow'
            else -- why
                /* not */ /* this */
                null
        end
    from x

  fix_str: |
    select
        case
            when name = 'cat' then 'meow'
            -- why
            /* not */ /* this */
        end
    from x

redundant_else_null_with_comment_on_one_line:
  fail_str: |
    select case when name = 'cat' then 'meow' else /* keep */ null end from x

  fix_str: |
    select case when name = 'cat' then 'meow' /* keep */ end from x

redundant_else_null_comment_after_null:
  # This comment is a sibling of the else clause rather than a child of it,
  # so it is already outside what the rule deletes.
  fail_str: |
    select
        case
            when name = 'cat' then 'meow'
            else null -- keep default
        end
    from x

  fix_str: |
    select
        case
            when name = 'cat' then 'meow' -- keep default
        end
    from x

redundant_else_null_line_comment_before_end:
  # The line comment's newline is inside the else clause. If it went with
  # the clause, the comment would run on into the END.
  fail_str: |
    select case when name = 'cat' then 'meow' else -- keep
     null end from x

  fix_str: |
    select case when name = 'cat' then 'meow' -- keep
     end from x

redundant_else_null_continuation_comment_after_inline_else:
  # The ELSE doesn't start its line, so there is no indent to inherit and the
  # continuation comment keeps its own.
  fail_str: |
    select
        case
            when name = 'cat' then 'meow' else
            -- one
            -- two
            null
        end
    from x

  fix_str: |
    select
        case
            when name = 'cat' then 'meow' -- one
            -- two
        end
    from x
