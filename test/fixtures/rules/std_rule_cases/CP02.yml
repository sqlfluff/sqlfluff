test_fail_snake_aliases:
  # Test for issue #5470
  # similar to PascalCase, case logic defined in CP01, but tested in CP02
  fail_str: |
    SELECT
    test1,
    test_2,
    testColumn3,
    TestColumn4,
    TESTCOLUMN5,
    TEST_COLUMN6,
    test_column_7_
  fix_str: |
    SELECT
    test_1,
    test_2,
    test_column_3,
    test_column_4,
    testcolumn_5,
    test_column_6,
    test_column_7_
  configs:
    core:
      dialect: tsql
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: snake

test_fail_camel_aliases:
  # Test for issue #5470
  # similar to PascalCase, case logic defined in CP01, but tested in CP02
  fail_str: |
    SELECT
    test1,
    test_2,
    testColumn3,
    TestColumn4,
    TESTCOLUMN5,
    TEST_COLUMN6,
    test_colUmn_7
  fix_str: |
    SELECT
    test1,
    test_2,
    testColumn3,
    testColumn4,
    tESTCOLUMN5,
    tEST_cOLUMN6,
    test_colUmn_7
  configs:
    core:
      dialect: tsql
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: camel

test_pass_placeholder_templater_colon_parameters:
  # Test that placeholder parameters are not incorrectly qualified with table aliases
  pass_str: |
    DELETE
    FROM STATUSVIEWDATAENTITY
    WHERE NOT EXISTS (
        SELECT 1
        FROM REFERENCEDSTATUSID AS R
        WHERE
            R.PACHLIACCOUNTID = :accountId
    )
  configs:
    core:
      templater: placeholder
    templater:
      placeholder:
        param_style: colon


test_fail_placeholder_templater_colon_parameters:
  # Test that placeholder parameters are not incorrectly qualified with table aliases
  fail_str: |
    DELETE
    FROM STATUSVIEWDATAENTITY
    WHERE NOT EXISTS (
        SELECT 1
        FROM REFERENCEDSTATUSID AS R
        WHERE
            r.PACHLIACCOUNTID = :accountId
    )
  fix_str: |
    DELETE
    FROM STATUSVIEWDATAENTITY
    WHERE NOT EXISTS (
        SELECT 1
        FROM REFERENCEDSTATUSID AS R
        WHERE
            R.PACHLIACCOUNTID = :accountId
    )
  configs:
    core:
      templater: placeholder
    templater:
      placeholder:
        param_style: colon

test_pass_placeholder_templater_dollar_parameters:
  # Test that dollar-style placeholder parameters are not incorrectly qualified
  pass_str: SELECT * FROM users WHERE id = $userId AND name = $userName
  configs:
    core:
      templater: placeholder
    templater:
      placeholder:
        param_style: dollar

test_pass_placeholder_templater_percent_parameters:
  # Test that percent-style placeholder parameters are not incorrectly qualified
  pass_str: SELECT * FROM users WHERE id = %s AND name = %s
  configs:
    core:
      templater: placeholder
    templater:
      placeholder:
        param_style: percent

test_fail_jinja_mixed_identifier_lower:
  # Issue #5616: only the literal part of a partly templated identifier is
  # checked and fixed. The template itself is left alone.
  fail_str: SELECT a FROM {{ env_type }}_MY_DB.my_schema.my_table
  fix_str: SELECT a FROM {{ env_type }}_my_db.my_schema.my_table
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: lower
    templater:
      jinja:
        context:
          env_type: DEV

test_fail_jinja_mixed_identifier_same_length_render:
  # The template renders to the same length as its source. The fix is still
  # applied to the literal source text only.
  fail_str: SELECT a FROM {{x}}_MY_DB
  fix_str: SELECT a FROM {{x}}_my_db
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: lower
    templater:
      jinja:
        context:
          x: ABCDE

test_fail_jinja_mixed_identifier_several_literals:
  fail_str: USE ROLE {{ env_type }}_{{ role_name }}_RL
  fix_str: USE ROLE {{ env_type }}_{{ role_name }}_rl
  configs:
    core:
      dialect: snowflake
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: lower
    templater:
      jinja:
        context:
          env_type: DEV
          role_name: ADMIN

test_pass_jinja_mixed_identifier_literal_ok:
  # The template renders upper case text, but the literal part is lower case.
  pass_str: SELECT a FROM {{ env_type }}_my_db
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: lower
    templater:
      jinja:
        context:
          env_type: DEV

test_pass_jinja_fully_templated_identifier:
  pass_str: SELECT a FROM {{ db_name }}
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: lower
    templater:
      jinja:
        context:
          db_name: MY_DB

test_fail_jinja_mixed_identifier_capitalise_split_literals:
  # Only the literal part that starts the identifier is capitalised.
  fail_str: SELECT A FROM ab{{ env }}CD
  fix_str: SELECT A FROM Ab{{ env }}cd
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: capitalise
    templater:
      jinja:
        context:
          env: X

test_fail_jinja_mixed_identifier_capitalise_after_template:
  # The identifier starts with the template, so the literal part is not
  # capitalised.
  fail_str: SELECT A FROM {{ env }}Db
  fix_str: SELECT A FROM {{ env }}db
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: capitalise
    templater:
      jinja:
        context:
          env: X

test_fail_jinja_mixed_identifier_pascal:
  fail_str: SELECT A FROM {{ env }}_my_db
  fix_str: SELECT A FROM {{ env }}_My_Db
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: pascal
    templater:
      jinja:
        context:
          env: dev

test_fail_jinja_mixed_identifier_snake_no_fix:
  # Snake case adds an underscore, which can't be mapped back onto the
  # literal text, so this is reported without a fix.
  fail_str: SELECT a FROM {{ env }}_MyDb
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: snake
    templater:
      jinja:
        context:
          env: dev

test_fail_jinja_mixed_identifier_template_at_end:
  fail_str: SELECT a FROM MY_{{ env }}
  fix_str: SELECT a FROM my_{{ env }}
  configs:
    rules:
      capitalisation.identifiers:
        extended_capitalisation_policy: lower
    templater:
      jinja:
        context:
          env: DEV

test_fail_jinja_mixed_identifier_consistent:
  # With the default consistent policy, the literal part is compared with the
  # other identifiers. The rendered DEV doesn't count.
  fail_str: SELECT my_col FROM {{ env }}_MY_DB
  fix_str: SELECT my_col FROM {{ env }}_my_db
  configs:
    templater:
      jinja:
        context:
          env: DEV
