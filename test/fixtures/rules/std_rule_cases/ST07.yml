rule: ST07

test_pass_specify_join_keys:
  pass_str: select x.a from x inner join y on x.id = y.id

test_fail_specify_join_keys_1:
  fail_str: select x.a from x inner join y using (id)
  fix_str: select x.a from x inner join y ON x.id = y.id

test_fail_specify_join_keys_1_with_alias:
  fail_str: select x.a from foo_table AS x inner join y using (id)
  fix_str: select x.a from foo_table AS x inner join y ON x.id = y.id

test_fail_specify_join_keys_1_with_subquery:
  fail_str: select x.a from (SELECT 1 AS a) AS x inner join y using (id)
  fix_str: select x.a from (SELECT 1 AS a) AS x inner join y ON x.id = y.id

test_fail_specify_join_keys_1_with_multi_using:
  fail_str: select x.a from x inner join y using (id, a)
  fix_str: select x.a from x inner join y ON x.id = y.id AND x.a = y.a

test_fail_specify_join_keys_2:
  desc: Keys were specified for first join but not the second one.
  fail_str: select x.a from x inner join y on x.id = y.id inner join z using (id)

test_unfixable_when_later_join_reuses_key:
  # Only the first join is eligible for a fix, and rewriting it here would
  # leave two copies of ``id`` on the left of ``inner join z using(id)``.
  # See https://github.com/sqlfluff/sqlfluff/issues/8950
  fail_str: |
    select x.a
    from x
    inner join y using(id, foo)
    inner join z using(id)
  fix_str: |
    select x.a
    from x
    inner join y using(id, foo)
    inner join z using(id)
  violations_after_fix:
    - description: Found USING statement. Expected only ON statements.
      name: structure.using
      warning: false
      fixes: []
      start_line_no: 3
      start_line_pos: 14
      start_file_pos: 31
      end_line_no: 3
      end_line_pos: 19
      end_file_pos: 36
    - description: Found USING statement. Expected only ON statements.
      name: structure.using
      warning: false
      fixes: []
      start_line_no: 4
      start_line_pos: 14
      start_file_pos: 59
      end_line_no: 4
      end_line_pos: 19
      end_file_pos: 64

select_using_fail:
  fail_str: |
    SELECT *
    FROM A_TABLE
    INNER JOIN (
        SELECT margin
        FROM B_TABLE
    ) USING (SOME_COLUMN)

test_fail_parent_child_positioning:
  # Check for issue from https://github.com/sqlfluff/sqlfluff/issues/3656
  fail_str: |
    select c1.a from c1 join c2 using (ID)
    join (select c3.a from c3 join c4 using (ID)) as c5 on c1.ID = c5.ID
  fix_str: |
    select c1.a from c1 join c2 ON c1.ID = c2.ID
    join (select c3.a from c3 join c4 ON c3.ID = c4.ID) as c5 on c1.ID = c5.ID

test_fail_comma_join_before_using:
  # A comma-join before the first USING join must pair the two tables the
  # join actually connects, not the SELECT's first two tables.
  fail_str: |
    SELECT b.id, c.id FROM a, b JOIN c USING (id)
  fix_str: |
    SELECT b.id, c.id FROM a, b JOIN c ON b.id = c.id

test_unfixable_with_unqualified_wildcard:
  # ``SELECT *`` exposes one merged copy of ``id`` under USING but one copy
  # per table under ON, so the rewrite would change the result columns.
  # See https://github.com/sqlfluff/sqlfluff/issues/8950
  fail_str: |
    SELECT * FROM a JOIN b USING (id)

test_fail_when_later_join_uses_other_keys:
  # A later join on unrelated keys is unaffected by the rewrite, so the first
  # join can still be fixed. The second USING clause stays reported.
  fail_str: |
    SELECT a.id, c.name
    FROM a
    INNER JOIN b USING (id)
    INNER JOIN c USING (name)
  fix_str: |
    SELECT a.id, c.name
    FROM a
    INNER JOIN b ON a.id = b.id
    INNER JOIN c USING (name)
  violations_after_fix:
    - description: Found USING statement. Expected only ON statements.
      name: structure.using
      warning: false
      fixes: []
      start_line_no: 4
      start_line_pos: 14
      start_file_pos: 68
      end_line_no: 4
      end_line_pos: 19
      end_file_pos: 73

test_unfixable_when_a_later_join_reuses_the_key_two_joins_away:
  # The reused key is two joins down: every later USING join must be checked.
  fail_str: |
    SELECT a.id, d.value
    FROM a
    INNER JOIN b USING (id)
    INNER JOIN c USING (name)
    INNER JOIN d USING (id)

fail_but_dont_fix_templated_table_names:
  fail_str: |
    SELECT
        {{ "table_a" }}.field_1,
        table_b.field_2
    FROM
        {{ "table_a" }}
    INNER JOIN table_b USING (id)

test_pass_clickhouse:
  pass_str: SELECT * FROM test1 as t1 LEFT SEMI JOIN test2 USING ty1,ty2;
  configs:
    core:
      dialect: clickhouse

test_fail_no_fix_when_using_col_referenced_unqualified:
  # https://github.com/sqlfluff/sqlfluff/issues/7230
  # `field_1` is referenced unqualified in the SELECT clause. That
  # reference is only unambiguous because USING de-duplicates the join
  # columns, so rewriting to an ON condition would produce invalid
  # (ambiguous) SQL. The USING clause is still flagged, but no fix is
  # offered.
  fail_str: |
    select field_1, field_2
    from table_a
    inner join table_b using (field_1)

test_fail_no_fix_when_using_col_referenced_unqualified_in_where:
  # https://github.com/sqlfluff/sqlfluff/issues/7230
  fail_str: |
    select table_a.field_2
    from table_a
    inner join table_b using (field_1)
    where field_1 > 0

test_fail_no_fix_when_using_col_accessed_as_struct:
  # https://github.com/sqlfluff/sqlfluff/issues/7230
  # `field_1.nested_field` is a struct access on the USING column, not a
  # table-qualified reference, so the rewrite would still make it ambiguous.
  fail_str: |
    select field_1.nested_field, field_2
    from table_a
    inner join table_b using (field_1)
  configs:
    core:
      dialect: bigquery

test_pass_fix_when_refs_table_qualified:
  # All references are table-qualified, so the fix is safe.
  fail_str: |
    select table_a.field_1, table_b.field_2
    from table_a
    inner join table_b using (field_1)
  fix_str: |
    select table_a.field_1, table_b.field_2
    from table_a
    inner join table_b ON table_a.field_1 = table_b.field_1

test_fail_no_fix_when_using_col_name_matches_table_name:
  # A bare reference to the USING column is a column reference even when a
  # joined table shares its name, so the rewrite would still make it
  # ambiguous.
  fail_str: |
    select field_1, table_a.field_2
    from table_a
    inner join field_1 using (field_1)

test_fail_no_fix_when_using_col_struct_access_matches_table_name:
  # https://github.com/sqlfluff/sqlfluff/issues/7230
  # A struct access on the USING column (`field_1.nested_field`) must stay
  # unfixable even when a joined table shares the column's name: the leading
  # identifier is the de-duplicated USING column, not that table, so the
  # rewrite would still make it ambiguous.
  fail_str: |
    select field_1.nested_field, table_a.field_2
    from table_a
    inner join field_1 using (field_1)
  configs:
    core:
      dialect: bigquery

test_fail_wildcard_inside_subquery_still_fixed:
  # The wildcard belongs to the subquery, which the outer join does not
  # widen, so it must not be treated as a bare ``*`` of this select.
  fail_str: |
    select (select * from t) as everything
    from a
    inner join b using (id)
  fix_str: |
    select (select * from t) as everything
    from a
    inner join b ON a.id = b.id

test_fail_wildcard_except_all_keys_still_fixed:
  # ``* EXCEPT (id)`` never exposes ``id``, so the merged-vs-duplicated
  # column distinction cannot reach the result and the fix is safe.
  fail_str: |
    select * except (id) from a
    inner join b using (id)
  fix_str: |
    select * except (id) from a
    inner join b ON a.id = b.id
  configs:
    core:
      dialect: bigquery

test_unfixable_wildcard_except_partial_keys:
  # Only ``id`` is excluded, so ``name`` still expands from one merged
  # copy to one copy per table.
  fail_str: |
    select * except (id) from a
    inner join b using (id, name)
  configs:
    core:
      dialect: bigquery

test_fail_comma_join_after_the_first_join:
  # The comma join that follows the first join is a sibling which is not
  # itself a join clause; it must not be read as a later USING join.
  fail_str: |
    select a.x, c.y from a
    inner join b using (id),
    c
  fix_str: |
    select a.x, c.y from a
    inner join b ON a.id = b.id,
    c

test_fail_qualified_wildcard_still_fixed:
  # ``table.*`` expands to that table's own columns, which USING does not
  # merge, so the rewrite cannot change what the wildcard expands to.
  fail_str: |
    select a.*, b.* from a
    inner join b using (id)
  fix_str: |
    select a.*, b.* from a
    inner join b ON a.id = b.id
