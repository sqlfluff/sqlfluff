rule: CV12

test_fail_sqlite_left_join_without_fix:
  fail_str: SELECT a.k, b.k FROM a LEFT JOIN b WHERE a.k = b.k;
  configs:
    core:
      dialect: sqlite

test_fail_ansi_left_join_without_fix:
  fail_str: SELECT a.k, b.k FROM a LEFT JOIN b WHERE a.k = b.k;

test_fail_ansi_right_join_without_fix:
  fail_str: SELECT a.k, b.k FROM a RIGHT JOIN b WHERE a.k = b.k;

test_fail_ansi_full_outer_join_without_fix:
  fail_str: SELECT a.k, b.k FROM a FULL OUTER JOIN b WHERE a.k = b.k;

test_noop_select_comma:
  # this syntax is currently not covered by CV12
  pass_str: |
    SELECT a.*, b.* FROM a, b

test_noop_no_where_clause:
  pass_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar

test_noop_delete:
  pass_str: |
    DELETE t1, t2 FROM t1 JOIN t2 JOIN t3
    WHERE t1.id=t2.id AND t2.id=t3.id;
  configs:
    core:
      dialect: mysql

test_noop_condition:
  pass_str: |
    SELECT foo.a, bar.b FROM foo LEFT JOIN bar ON foo.x = bar.x

test_noop_crossjoin:
  pass_str: |
    SELECT foo.a, bar.b FROM foo CROSS JOIN bar WHERE bar.x > 3

test_noop_natural_join:
  # A NATURAL JOIN cannot take an ON clause, so there is nothing to move
  # the WHERE condition into.
  pass_str: |
    SELECT foo.a, bar.b FROM foo NATURAL JOIN bar WHERE bar.x > 3

test_fail_natural_join_mixed_with_later_join:
  # The NATURAL JOIN is skipped, but its predicate (a.k = b.k) must not be
  # hoisted into the following JOIN's ON clause: only conditions that
  # reference the joined table itself may be moved.
  fail_str: |
    SELECT * FROM a NATURAL JOIN b JOIN c WHERE a.k = b.k AND a.m = c.m
  fix_str: |
    SELECT * FROM a NATURAL JOIN b JOIN c ON a.m = c.m WHERE a.k = b.k

test_fail_natural_join_mixed_with_later_outer_join:
  # A later outer join must keep both predicates in WHERE because moving one
  # into ON could change the result set.
  fail_str: |
    SELECT * FROM a NATURAL JOIN b LEFT JOIN c WHERE a.k = b.k AND a.m = c.m

test_fail_cross_join_mixed_with_later_join:
  # Same as above for a skipped CROSS JOIN: a.k = b.k references neither the
  # JOIN's table nor an ON-able join, so it stays in the WHERE clause.
  fail_str: |
    SELECT * FROM a CROSS JOIN b JOIN c WHERE a.k = b.k AND a.m = c.m
  fix_str: |
    SELECT * FROM a CROSS JOIN b JOIN c ON a.m = c.m WHERE a.k = b.k

test_fail_cross_join_mixed_with_later_outer_join:
  # The outer join must not move the predicate into its ON clause.
  fail_str: |
    SELECT * FROM a CROSS JOIN b LEFT JOIN c WHERE a.k = b.k AND a.m = c.m

test_fail_sparksql_left_semi_join_with_fix:
  fail_str: |
    SELECT employee.id
    FROM employee
    LEFT SEMI JOIN department
    WHERE employee.deptno = department.deptno
  fix_str: |
    SELECT employee.id
    FROM employee
    LEFT SEMI JOIN department ON employee.deptno = department.deptno
  configs:
    core:
      dialect: sparksql

test_fail_sparksql_left_anti_join_with_fix:
  fail_str: |
    SELECT employee.id
    FROM employee
    LEFT ANTI JOIN department
    WHERE employee.deptno = department.deptno
  fix_str: |
    SELECT employee.id
    FROM employee
    LEFT ANTI JOIN department ON employee.deptno = department.deptno
  configs:
    core:
      dialect: sparksql

test_noop_using:
  pass_str: |
    SELECT foo.id, bar.id FROM foo LEFT JOIN bar USING (id)
  configs:
    core:
      dialect: snowflake

test_noop_global_cross_join_clickhouse:
  pass_str: |
    SELECT foo.a, bar.b FROM foo GLOBAL CROSS JOIN bar;
  configs:
    core:
      dialect: clickhouse

test_noop_positional_join_duckdb:
  pass_str: |
    SELECT foo.a, bar.b FROM foo POSITIONAL JOIN bar WHERE bar.x > 3;
  configs:
    core:
      dialect: duckdb

test_noop_outer_apply_tsql:
  pass_str: |
    SELECT foo.a, bar.b FROM foo OUTER APPLY bar(foo.a) AS bar WHERE bar.x > 3;
  configs:
    core:
      dialect: tsql

test_fail_unqualified:
  # ambiguous, fail without fix
  fail_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar WHERE a = b

test_fail_missing_clause:
  fail_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar WHERE foo.x = bar.y
  fix_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar ON foo.x = bar.y

test_fail_missing_clause_and_stmt:
  fail_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar WHERE foo.x = bar.y AND foo.x = 3
  fix_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar ON foo.x = bar.y WHERE foo.x = 3

test_fail_missing_clause_and_stmt_bracketed:
  fail_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar WHERE (foo.x = bar.y) AND foo.t = 3
  fix_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar ON (foo.x = bar.y) WHERE foo.t = 3

test_fail_missing_clause_two_joins:
  fail_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar JOIN baz WHERE foo.x = bar.y AND foo.x = baz.t AND foo.c = 3
  fix_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar ON foo.x = bar.y JOIN baz ON foo.x = baz.t WHERE foo.c = 3

test_fail_not_simplifable:
  # Fail without fix
  fail_str: |
    SELECT foo.a, bar.b FROM foo JOIN bar WHERE (foo.x = bar.y) OR foo.x != foo.z

test_fail_missing_clause_and_stmt_subquery:
  fail_str: |
    SELECT foo.a, bar.b FROM (SELECT a, x FROM t1) AS foo JOIN (SELECT b, y FROM t2) AS bar WHERE foo.x = bar.y AND foo.x = 3
  fix_str: |
    SELECT foo.a, bar.b FROM (SELECT a, x FROM t1) AS foo JOIN (SELECT b, y FROM t2) AS bar ON foo.x = bar.y WHERE foo.x = 3

test_fail_missing_clause_and_stmt_qualified:
  fail_str: |
    SELECT foo.a, bar.b FROM schema.foo JOIN schema.bar WHERE schema.foo.x = schema.bar.y AND schema.foo.x = 3
  fix_str: |
    SELECT foo.a, bar.b FROM schema.foo JOIN schema.bar ON schema.foo.x = schema.bar.y WHERE schema.foo.x = 3

test_fail_join_with_bracketed_join:
  fail_str: |
    SELECT * FROM
      bar
      JOIN (
        foo1
        JOIN foo2 ON (foo1.id = foo2.id)
      )
    WHERE
      bar.id = foo1.id;

test_pass_left_join_unnest_where_aliased:
  pass_str: |
    SELECT
      t.user_id,
      unnested_value AS purchased_product
    FROM
      t
    LEFT JOIN
      UNNEST(t.purchases) AS unnested_value
    WHERE
      unnested_value = 'laptop'

test_pass_left_join_unnest_where_unaliased:
  pass_str: |
    SELECT
      t.user_id
    FROM
      t
    LEFT JOIN
      UNNEST(t.purchases)
    WHERE
      t.user_id != 1

test_pass_templated_join_clause_not_fixed:
  # https://github.com/sqlfluff/sqlfluff/issues/8230
  # Moving the condition into an ON clause rewrites the whole join clause. When
  # that clause is templated the resulting patch can't be mapped back to the
  # source and is dropped, but the (literal) WHERE rewrite still applied - which
  # deleted the join condition altogether.
  pass_str: |
    select a.id, b.id as b_id
    from table_a as a
    left join {{ ref('table_b') }} as b
    where a.region = b.region
  configs:
    core:
      dialect: snowflake
      templater: jinja

test_pass_templated_join_clause_keeps_other_filters:
  # The join condition used to disappear while the unrelated filter survived,
  # so the fix looked successful but silently changed the query's meaning.
  pass_str: |
    select a.id
    from table_a as a
    left join {{ ref('table_b') }} as b
    where a.region = b.region and a.x = 1
  configs:
    core:
      dialect: snowflake
      templater: jinja

test_fail_templated_join_alongside_literal_join:
  # Only the non-templated join is rewritten; the templated join's condition
  # stays put in the WHERE clause.
  fail_str: |
    select a.id
    from table_a as a
    left join {{ ref('table_b') }} as b
    join table_c as c
    where a.region = b.region and a.k = c.k
  fix_str: |
    select a.id
    from table_a as a
    left join {{ ref('table_b') }} as b
    join table_c as c ON a.k = c.k
    where a.region = b.region
  configs:
    core:
      dialect: snowflake
      templater: jinja

test_pass_sqlite_left_join_with_on_and_where:
  pass_str: |
    SELECT a.k, b.k
    FROM a LEFT JOIN b ON a.k = b.k
    WHERE a.active
  configs:
    core:
      dialect: sqlite

test_fail_where_followed_by_order_by:
  # The whole WHERE clause moves to the join, and a clause after it means the
  # WHERE clause is not the last child of the select statement.
  fail_str: |
    SELECT foo.a
    FROM foo
    INNER JOIN bar
    WHERE foo.x = bar.y
    ORDER BY foo.a
  fix_str: |
    SELECT foo.a
    FROM foo
    INNER JOIN bar ON foo.x = bar.y
    ORDER BY foo.a

test_fail_where_followed_by_group_by:
  fail_str: |
    SELECT foo.a
    FROM foo
    INNER JOIN bar
    WHERE foo.x = bar.y
    GROUP BY foo.a
  fix_str: |
    SELECT foo.a
    FROM foo
    INNER JOIN bar ON foo.x = bar.y
    GROUP BY foo.a

test_fail_where_followed_by_limit:
  fail_str: |
    SELECT foo.a
    FROM foo
    INNER JOIN bar
    WHERE foo.x = bar.y
    LIMIT 1
  fix_str: |
    SELECT foo.a
    FROM foo
    INNER JOIN bar ON foo.x = bar.y
    LIMIT 1
