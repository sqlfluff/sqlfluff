test_fail_no_fix_unqualified_correlated_subquery_5983:
  fail_str: |
    SELECT
        *,
        (
          SELECT C.JobId FROM customer AS C WHERE C.Id = CustomerId LIMIT 1
        ) AS CustomerId
    FROM (
    SELECT
        F.*,
        B.*
    FROM
        foo AS F
        LEFT JOIN bar AS B ON P.Id = B.ParentId
    );

test_fail_cte_qualified_to_unqualified_6014:
  fail_str: |
    with
    final as (
        select
            my_table.first,
            second
        from my_table
    )

    select *
    from final
  fix_str: |
    with
    final as (
        select
            first,
            second
        from my_table
    )

    select *
    from final
  configs:
    rules:
      references.consistent:
        single_table_references: unqualified

test_fail_cte_unqualified_to_qualified_6014:
  fail_str: |
    with
    final as (
        select
            my_table.first,
            second
        from my_table
    )

    select *
    from final
  fix_str: |
    with
    final as (
        select
            my_table.first,
            my_table.second
        from my_table
    )

    select *
    from final
  configs:
    rules:
      references.consistent:
        single_table_references: qualified

test_pass_postgres_named_arguments:
  pass_str: |
    select t1.b
    from __test__(a := 1) t1;
  configs:
    core:
      dialect: postgres

test_pass_trino_lambda_expression:
  pass_str: |
    SELECT
        a_column,
        TRANSFORM(array_col, x -> x.example) AS array_col_example
    FROM example_table;
  configs:
    core:
      dialect: trino

test_pass_snowflake_lambda_expression:
  pass_str: |
    select
        a_column,
        transform(array_col, x -> x + 1) as array_col_example
    from example_table;
  configs:
    core:
      dialect: snowflake

test_pass_databricks_lambda_transform:
  # Lambda parameters in higher-order functions should not be treated as
  # table references in Databricks (multi-part struct access via lambda param).
  # https://github.com/sqlfluff/sqlfluff/issues/7379
  pass_str: |
    WITH source_data AS (
      SELECT
        'test' AS id,
        '[{"taskId": {"oid": "abc"}}]' AS json_array
    )
    SELECT
      id,
      transform(
        from_json(json_array, 'array<struct<taskId:struct<oid:string>>>'),
        item -> struct(item.taskId.oid AS task_id)
      ) AS transformed
    FROM source_data
  configs:
    core:
      dialect: databricks

test_pass_databricks_lambda_filter:
  # Another higher-order function pattern with lambda parameters.
  # https://github.com/sqlfluff/sqlfluff/issues/7379
  pass_str: |
    SELECT
      id,
      filter(
        array_col,
        x -> x.nested_field.value > 0
      ) AS filtered
    FROM my_table
  configs:
    core:
      dialect: databricks

test_pass_tsql_collate_clause:
  # Collation references should not be treated as column references
  # and should not trigger RF03
  pass_str: |
    SELECT T.FIELD1
    FROM TABLE1 AS T
    WHERE T.name COLLATE LATIN1_GENERAL_CI_AI LIKE '%';
  configs:
    core:
      dialect: tsql

test_pass_databricks_struct_function_aliases:
  # STRUCT() function aliases in Databricks should not be treated as
  # column references that need qualifying.
  # https://github.com/sqlfluff/sqlfluff/issues/6919
  pass_str: |
    SELECT
        tbl.a,
        STRUCT(
            SUM(tbl.b) AS MEASUREMENT_VALUE,
            'MeasurementName' AS MEASUREMENT_NAME
        ) AS measurement
    FROM tbl
  configs:
    core:
      dialect: databricks

test_pass_databricks_struct_function_aliases_qualified:
  # STRUCT() aliases should not interfere with qualification checks.
  # https://github.com/sqlfluff/sqlfluff/issues/6919
  pass_str: |
    SELECT
        tbl.a,
        STRUCT(
            SUM(tbl.b) AS MEASUREMENT_VALUE
        ) AS measurement
    FROM tbl
  configs:
    core:
      dialect: databricks
    rules:
      references.consistent:
        single_table_references: qualified

test_pass_sparksql_struct_function_aliases:
  # STRUCT() function aliases in SparkSQL should also be handled correctly.
  # https://github.com/sqlfluff/sqlfluff/issues/6919
  pass_str: |
    SELECT
        tbl.a,
        STRUCT(
            tbl.b AS val
        ) AS measurement
    FROM tbl
  configs:
    core:
      dialect: sparksql

test_pass_hive_struct_function_aliases:
  # STRUCT() function aliases in Hive should also be handled correctly.
  # https://github.com/sqlfluff/sqlfluff/issues/6919
  pass_str: |
    SELECT
        tbl.a,
        STRUCT(
            tbl.b AS val
        ) AS measurement
    FROM tbl
  configs:
    core:
      dialect: hive
test_pass_placeholder_colon_double_colon_cast:
  # Placeholder parameters followed by :: cast operator should not be treated
  # as unqualified column references. See: https://github.com/sqlfluff/sqlfluff/issues/7570
  pass_str: |
    select mt.colname from mytable as mt
    where mt.colname = :param::text
  configs:
    core:
      templater: placeholder
      dialect: postgres
    templater:
      placeholder:
        param_style: colon

test_pass_postgres_whole_row_json_operator:
  # A bare reference matching the table's own alias is a whole-row reference
  # (here the left operand of the `->>` JSON operator), not a column, so RF03
  # must not flag it or "qualify" it as the invalid `pattern_obj.pattern_obj`.
  # https://github.com/sqlfluff/sqlfluff/issues/6904
  pass_str: |
    SELECT pattern_obj ->> 'col' AS c
    FROM jsonb_array_elements('[]'::jsonb) AS pattern_obj
  configs:
    core:
      dialect: postgres
    rules:
      references.consistent:
        single_table_references: qualified

test_pass_postgres_quoted_whole_row_json_operator:
  # Quoted aliases should use normalized identifier matching for the same
  # whole-row-reference exemption, rather than comparing the quoted raw text.
  pass_str: |
    SELECT "Pattern_Obj" ->> 'col' AS c
    FROM jsonb_array_elements('[]'::jsonb) AS "Pattern_Obj"
  configs:
    core:
      dialect: postgres
    rules:
      references.consistent:
        single_table_references: qualified

test_pass_whole_row_reference_mixed_qualification:
  # `tbl` is a whole-row reference matching the single table's name, so even when
  # it appears before the qualified `tbl.a` it must not count as an unqualified
  # column reference (and so must not be "fixed" to `tbl.tbl`).
  # https://github.com/sqlfluff/sqlfluff/issues/6904
  pass_str: SELECT tbl, tbl.a FROM tbl

test_pass_athena_struct_disabled_by_default:
  # RF03 is disabled by default for Athena (like BigQuery/Hive/Redshift) due to
  # historical false positives with STRUCT dot-access, so this passes even
  # though `c.struct.val` would otherwise look like a qualified reference.
  # https://github.com/sqlfluff/sqlfluff/issues/6250
  pass_str: |
    select
        a,
        b,
        c.struct.val
    from sch.t1
  configs:
    core:
      dialect: athena
    rules:
      references.consistent:
        single_table_references: consistent

test_pass_athena_struct_field_access_consistent:
  # With force_enable, `c.struct.val` is recognised as a struct field access
  # (its leading part "c" is not the table alias "t1"), so it is treated as
  # unqualified -- consistent with the other bare columns `a` and `b`.
  # https://github.com/sqlfluff/sqlfluff/issues/6250
  pass_str: |
    select
        a,
        b,
        c.struct.val
    from sch.t1
  configs:
    core:
      dialect: athena
    rules:
      references.consistent:
        single_table_references: consistent
        force_enable: true

test_fail_athena_struct_field_access_genuine_inconsistency:
  # A genuinely table-qualified reference (`t1.b`) alongside unqualified
  # references and a struct field access should still be flagged: the struct
  # access and `a` are both unqualified, but `t1.b` is genuinely qualified and
  # inconsistent with them.
  # https://github.com/sqlfluff/sqlfluff/issues/6250
  fail_str: |
    select
        a,
        t1.b,
        c.struct.val
    from sch.t1
  fix_str: |
    select
        t1.a,
        t1.b,
        t1.c.struct.val
    from sch.t1
  configs:
    core:
      dialect: athena
    rules:
      references.consistent:
        single_table_references: consistent
        force_enable: true

test_fail_athena_struct_field_access_qualified_config:
  # With single_table_references=qualified and force_enable, the struct field
  # access `c.struct.val` is recognised as unqualified (its leading part "c"
  # is not the table alias "t1") and so must be qualified like the rest.
  # https://github.com/sqlfluff/sqlfluff/issues/6250
  fail_str: |
    select
        a,
        c.struct.val
    from sch.t1
  fix_str: |
    select
        t1.a,
        t1.c.struct.val
    from sch.t1
  configs:
    core:
      dialect: athena
    rules:
      references.consistent:
        single_table_references: qualified
        force_enable: true

test_pass_tsql_outer_apply_correlated_unqualified_8626:
  # The APPLY subquery can see the tables of the outer query, so removing
  # the qualifiers would change `l.order_id = o.order_id` into
  # `order_id = order_id`. Treat it like a correlated WHERE subquery.
  # https://github.com/sqlfluff/sqlfluff/issues/8626
  pass_str: |
    select o.order_id
    from dbo.orders as o
    outer apply (
        select top 1 1 as has_lines
        from dbo.order_lines as l
        where l.order_id = o.order_id
    ) as ol
  configs:
    core:
      dialect: tsql
    rules:
      references.consistent:
        single_table_references: unqualified

test_pass_tsql_cross_apply_correlated_unqualified_8626:
  # Same as above, for CROSS APPLY.
  pass_str: |
    select o.order_id
    from dbo.orders as o
    cross apply (
        select top 1 1 as has_lines
        from dbo.order_lines as l
        where l.order_id = o.order_id
    ) as ol
  configs:
    core:
      dialect: tsql
    rules:
      references.consistent:
        single_table_references: unqualified

test_pass_postgres_lateral_correlated_unqualified_8626:
  # LATERAL subqueries can also see the tables of the outer query.
  pass_str: |
    select o.order_id
    from orders as o
    cross join lateral (
        select 1 as has_lines
        from order_lines as l
        where l.order_id = o.order_id
    ) as ol
  configs:
    core:
      dialect: postgres
    rules:
      references.consistent:
        single_table_references: unqualified

test_fail_no_fix_tsql_cross_apply_correlated_qualified_8626:
  # The unqualified `order_id` could refer to either `l` or `o`, so
  # qualifying it is unsafe.
  fail_str: |
    select o.order_id
    from dbo.orders as o
    cross apply (
        select top 1 1 as has_lines
        from dbo.order_lines as l
        where order_id = o.order_id
    ) as ol
  configs:
    core:
      dialect: tsql
    rules:
      references.consistent:
        single_table_references: qualified

test_fail_tsql_cross_apply_uncorrelated_unqualified_8626:
  # Without references to the outer query, the APPLY subquery is still a
  # single table select and can be fixed.
  fail_str: |
    select o.order_id
    from dbo.orders as o
    cross apply (
        select top 1 l.order_id
        from dbo.order_lines as l
    ) as ol
  fix_str: |
    select o.order_id
    from dbo.orders as o
    cross apply (
        select top 1 order_id
        from dbo.order_lines as l
    ) as ol
  configs:
    core:
      dialect: tsql
    rules:
      references.consistent:
        single_table_references: unqualified

test_fail_tsql_derived_table_join_unqualified_8626:
  # Regression guard: a plain (uncorrelated) derived table in the FROM
  # clause is still a single table select and can be fixed.
  fail_str: |
    select o.order_id
    from dbo.orders as o
    inner join (
