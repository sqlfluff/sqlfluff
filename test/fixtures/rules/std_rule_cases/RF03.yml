test_pass_postgres_nested_lateral_correlated_unqualified_8626:
  # A nested LATERAL subquery can see the tables of all enclosing queries, not
  # just its direct parent. `a.x` refers to the outermost query.
  pass_str: |
    select e.y
    from a
    cross join lateral (
        select d.z from b
        cross join lateral (
            select c.y, c.z from c where c.x = a.x
        ) as d
    ) as e
  configs:
    core:
      dialect: postgres
    rules:
      references.consistent:
        single_table_references: unqualified

