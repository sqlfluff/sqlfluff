rule: LT01

test_pass_parenthesis_block_isolated:
  pass_str: |
    SELECT * FROM (SELECT 1 AS C1) AS T1;

test_pass_parenthesis_block_isolated_template:
  pass_str: |
    {{ 'SELECT * FROM (SELECT 1 AS C1) AS T1;' }}
  configs:
    core:
      ignore_templated_areas: false

test_fail_parenthesis_block_not_isolated:
  fail_str: |
    SELECT * FROM(SELECT 1 AS C1)AS T1;
  fix_str: |
    SELECT * FROM (SELECT 1 AS C1) AS T1;

test_fail_parenthesis_block_not_isolated_templated:
  fail_str: |
    {{ 'SELECT * FROM(SELECT 1 AS C1)AS T1;' }}
  configs:
    core:
      ignore_templated_areas: false

test_pass_parenthesis_function:
  pass_str: |
    SELECT foo(5) FROM T1;

test_pass_snowflake_match_condition:
  pass_str: |
    select *
    from table1
    asof join table2 match_condition(t1 > t2) on pk1 = pk2;
  configs:
    core:
      dialect: snowflake

test_fail_snowflake_match_condition:
  fail_str: |
    select
        table1.pk1,
        table1.t1
    from table1
        asof join
        table2
        match_condition
        (t1 > t2)
        on table1.pk1 = table2.pk2;
  fix_str: |
    select
        table1.pk1,
        table1.t1
    from table1
        asof join
        table2
        match_condition(t1 > t2)
        on table1.pk1 = table2.pk2;
  configs:
    core:
      dialect: snowflake

test_pass_snowflake_semantic_view_touching_bracket:
  pass_str: |
    select *
    from semantic_view(
        sales_analysis
        dimensions orders.order_date
        metrics orders.revenue
    );
  configs:
    core:
      dialect: snowflake

test_fail_snowflake_semantic_view_spaced_bracket:
  fail_str: |
    select *
    from semantic_view (
        sales_analysis
        dimensions orders.order_date
        metrics orders.revenue
    );
  fix_str: |
    select *
    from semantic_view(
        sales_analysis
        dimensions orders.order_date
        metrics orders.revenue
    );
  configs:
    core:
      dialect: snowflake

test_pass_ansi_bracketed_data_types:
  pass_str: |
    CREATE TABLE fractest (c1 TIME(2), c2 DATETIME(2), c3 TIMESTAMP(2));

test_pass_mysql_bracketed_data_types:
  pass_str: |
    CREATE TABLE fractest (c1 TIME(2), c2 DATETIME(2), c3 TIMESTAMP(2));
  configs:
    core:
      dialect: mysql

test_pass_mysql_index_prefix_length:
  # A column prefix length in an index shouldn't be spaced, same as a data type
  # length. https://github.com/sqlfluff/sqlfluff/issues/4541
  pass_str: |
    CREATE TABLE test (blob_col BLOB, INDEX (blob_col(10)));
  configs:
    core:
      dialect: mysql

test_fail_mysql_index_prefix_length:
  # The rule still enforces touch spacing on the prefix length.
  fail_str: |
    CREATE TABLE test (blob_col BLOB, INDEX (blob_col (10)));
  fix_str: |
    CREATE TABLE test (blob_col BLOB, INDEX (blob_col(10)));
  configs:
    core:
      dialect: mysql

# An array type suffix `[]` should touch the type name rather than being
# spaced like a standalone square bracket.
# https://github.com/sqlfluff/sqlfluff/issues/5005
test_pass_postgres_array_data_type:
  pass_str: |
    CREATE TABLE t (a int[], b text[][]);
  configs:
    core:
      dialect: postgres

test_fail_postgres_array_data_type_extra_space:
  fail_str: |
    CREATE TABLE t (a int []);
  fix_str: |
    CREATE TABLE t (a int[]);
  configs:
    core:
      dialect: postgres

# A bare array literal still keeps the space after the preceding keyword.
test_pass_duckdb_array_literal_not_touched:
  pass_str: |
    SELECT [1, 2, 3] AS a;
  configs:
    core:
      dialect: duckdb

# Snowflake VECTOR is a parameterised datatype, so its parameters touch the
# keyword like other parameterised types such as NUMBER(10, 2).
test_pass_snowflake_vector_type_touching_bracket:
  pass_str: |
    select
        x::vector(float, 768) as v,
        cast(y as vector(int, 3)) as w;
  configs:
    core:
      dialect: snowflake

test_fail_snowflake_vector_type_spaced_bracket:
  fail_str: |
    select x::vector (float,  768) as v;
  fix_str: |
    select x::vector(float, 768) as v;
  configs:
    core:
      dialect: snowflake

test_fail_snowflake_vector_type_newline_before_bracket:
  fail_str: |
    create table t (v vector
    (float, 3));
  fix_str: |
    create table t (v vector(float, 3));
  configs:
    core:
      dialect: snowflake
