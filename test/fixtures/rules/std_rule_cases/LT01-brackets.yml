rule: LT01

test_pass_parenthesis_block_isolated:
  pass_str: |
    SELECT * FROM (SELECT 1 AS C1) AS T1;

test_pass_parenthesis_block_isolated_template:
  pass_str: |
    {{ 'SELECT * FROM (SELECT 1 AS C1) AS T1;' }}
  configs:
    core:
      ignore_templated_areas: false

test_fail_parenthesis_block_not_isolated:
  fail_str: |
    SELECT * FROM(SELECT 1 AS C1)AS T1;
  fix_str: |
    SELECT * FROM (SELECT 1 AS C1) AS T1;

test_fail_parenthesis_block_not_isolated_templated:
  fail_str: |
    {{ 'SELECT * FROM(SELECT 1 AS C1)AS T1;' }}
  configs:
    core:
      ignore_templated_areas: false

test_pass_parenthesis_function:
  pass_str: |
    SELECT foo(5) FROM T1;

test_pass_snowflake_match_condition:
  pass_str: |
    select *
    from table1
    asof join table2 match_condition(t1 > t2) on pk1 = pk2;
  configs:
    core:
      dialect: snowflake

test_fail_snowflake_match_condition:
  fail_str: |
    select
        table1.pk1,
        table1.t1
    from table1
        asof join
        table2
        match_condition
        (t1 > t2)
        on table1.pk1 = table2.pk2;
  fix_str: |
    select
        table1.pk1,
        table1.t1
    from table1
        asof join
        table2
        match_condition(t1 > t2)
        on table1.pk1 = table2.pk2;
  configs:
    core:
      dialect: snowflake

test_pass_ansi_bracketed_data_types:
  pass_str: |
    CREATE TABLE fractest (c1 TIME(2), c2 DATETIME(2), c3 TIMESTAMP(2));

test_pass_mysql_bracketed_data_types:
  pass_str: |
    CREATE TABLE fractest (c1 TIME(2), c2 DATETIME(2), c3 TIMESTAMP(2));
  configs:
    core:
      dialect: mysql

test_pass_mysql_index_prefix_length:
  # A column prefix length in an index shouldn't be spaced, same as a data type
  # length. https://github.com/sqlfluff/sqlfluff/issues/4541
  pass_str: |
    CREATE TABLE test (blob_col BLOB, INDEX (blob_col(10)));
  configs:
    core:
      dialect: mysql

test_fail_mysql_index_prefix_length:
  # The rule still enforces touch spacing on the prefix length.
  fail_str: |
    CREATE TABLE test (blob_col BLOB, INDEX (blob_col (10)));
  fix_str: |
    CREATE TABLE test (blob_col BLOB, INDEX (blob_col(10)));
  configs:
    core:
      dialect: mysql

# An array type suffix `[]` should touch the type name rather than being
# spaced like a standalone square bracket.
# https://github.com/sqlfluff/sqlfluff/issues/5005
test_pass_postgres_array_data_type:
  pass_str: |
    CREATE TABLE t (a int[], b text[][]);
  configs:
    core:
      dialect: postgres

test_fail_postgres_array_data_type_extra_space:
  fail_str: |
    CREATE TABLE t (a int []);
  fix_str: |
    CREATE TABLE t (a int[]);
  configs:
    core:
      dialect: postgres

# A bare array literal still keeps the space after the preceding keyword.
test_pass_duckdb_array_literal_not_touched:
  pass_str: |
    SELECT [1, 2, 3] AS a;
  configs:
    core:
      dialect: duckdb

# A column list after a T-SQL table alias is written both ways, so neither
# is enforced. The docs attach it (`AS T2(Loc)`), which used to be flagged.
# https://github.com/sqlfluff/sqlfluff/issues/6733
test_pass_tsql_alias_column_list_touching:
  pass_str: |
    SELECT r.c.value('column[1]', 'varchar(10)') AS [Value]
    FROM @xml.nodes('/rows/row') AS r(c);
  configs:
    core:
      dialect: tsql

test_pass_tsql_alias_column_list_spaced:
  pass_str: |
    SELECT r.c.value('column[1]', 'varchar(10)') AS [Value]
    FROM @xml.nodes('/rows/row') AS r (c);
  configs:
    core:
      dialect: tsql

# Either style can still be enforced by configuring the segment.
# The VALUES clause column alias list is the same segment, so it is not
# enforced either. Pinned because the config comment says so.
test_pass_tsql_values_alias_column_list_touching:
  pass_str: |
    SELECT a, b
    FROM (VALUES (1, 2), (3, 4)) AS t(a, b);
  configs:
    core:
      dialect: tsql

test_fail_tsql_alias_column_list_spaced_when_touch_configured:
  fail_str: |
    SELECT r.c.value('column[1]', 'varchar(10)') AS [Value]
    FROM @xml.nodes('/rows/row') AS r (c);
  fix_str: |
    SELECT r.c.value('column[1]', 'varchar(10)') AS [Value]
    FROM @xml.nodes('/rows/row') AS r(c);
  configs:
    core:
      dialect: tsql
    layout:
      type:
        alias_column_list:
          spacing_before: touch
