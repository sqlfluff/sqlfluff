test_fail_tsql_nested_and_outer_missing_terminators:
  # Keep the inner and enclosing fixes separate to avoid adding END;;.
  fail_str: |
    CREATE PROCEDURE dbo.p AS BEGIN
      SELECT 1
      SELECT 2
    END
  fix_str: |
    CREATE PROCEDURE dbo.p AS BEGIN
      SELECT 1;
      SELECT 2;
    END;
  configs:
    core:
      dialect: tsql
    rules:
      convention.terminator:
        require_final_semicolon: true

test_fail_tsql_nested_partially_terminated:
  fail_str: |
    CREATE PROCEDURE dbo.p AS BEGIN
      DECLARE @value INT;
      IF 1 = 1 SET @value = 1;
      ELSE BEGIN SET @value = 0 END
      RETURN
    END;
  fix_str: |
    CREATE PROCEDURE dbo.p AS BEGIN
      DECLARE @value INT;
      IF 1 = 1 SET @value = 1;
      ELSE BEGIN SET @value = 0; END
      RETURN;
    END;
  configs:
    core:
      dialect: tsql
    rules:
      convention.terminator:
        require_final_semicolon: true

