test_pass_tsql_batch_already_has_semicolon:
  # Test that when a semicolon already exists after the last statement in a batch,
  # no changes are made (covers line 389: semi_colon_exist_flag = True)
  pass_str: |
    CREATE SCHEMA staging;
    GO
    CREATE TABLE test (id INT);
  configs:
    core:
      dialect: tsql
    rules:
      convention.terminator:
        require_final_semicolon: true

test_fail_tsql_function_nested_statements:
  # https://github.com/sqlfluff/sqlfluff/issues/2588
  fail_str: |
    CREATE FUNCTION dbo.funxn (
        @incoming varchar(50)
    ) RETURNS int
    AS
    BEGIN
        DECLARE @result int
        IF 1 = 1 SET @result = 1
        ELSE
            BEGIN
                SET @result = 0
            END

        RETURN @result
    END;
  fix_str: |
    CREATE FUNCTION dbo.funxn (
        @incoming varchar(50)
    ) RETURNS int
    AS
    BEGIN
        DECLARE @result int;
        IF 1 = 1 SET @result = 1;
        ELSE
            BEGIN
                SET @result = 0;
            END

        RETURN @result;
    END;
  configs:
    core:
      dialect: tsql
    rules:
      convention.terminator:
        require_final_semicolon: true

test_pass_tsql_function_nested_statements_already_terminated:
  pass_str: |
    CREATE FUNCTION dbo.funxn (
        @incoming varchar(50)
    ) RETURNS int
    AS
    BEGIN
        DECLARE @result int;
        IF 1 = 1 SET @result = 1;
        ELSE
            BEGIN
                SET @result = 0;
            END

        RETURN @result;
    END;
  configs:
    core:
      dialect: tsql
    rules:
      convention.terminator:
        require_final_semicolon: true

test_fail_tsql_procedure_consecutive_statements:
  fail_str: |
    CREATE PROCEDURE dbo.p AS BEGIN
      DECLARE @value INT
      SET @value = 1
      RETURN
    END;
  fix_str: |
    CREATE PROCEDURE dbo.p AS BEGIN
